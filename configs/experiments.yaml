# Comparison runs: ablations, baselines and generator scenarios.
# Every variant and baseline is run on every scenario and seed, on the same split.
# The first variant is the reference for the paired t-tests in the summary.
seeds: [1, 2, 3, 4, 5]

scenarios:
  # Generator settings from default.yaml.
  default: {}
  # The notebook's scenario, where the two classes do not overlap at all.
  no_overlap:
    generator:
      n_coincidental_episodes: 100
      n_coordinated_episodes: 50
      coincidental_burst_fraction: 0
      coincidental_cluster_fraction: 0
      coincidental_lookalike_fraction: 0
      stealth_campaign_fraction: 0
      storage_pivot_probability: 0
      missed_event_probability: 0
      stray_vm_probability: 0
  # Every campaign hops hours apart instead of minutes, so timing alone separates less.
  slow_campaigns:
    generator:
      hop_delay_minutes: [120, 720]
  # Only 10 network fabrics: unrelated VMs often share one, so topology separates less.
  crowded_networks:
    generator:
      n_network: 10
  # Domain randomisation: these settings are drawn again for every seed.
  randomised:
    randomize:
      n_network: [5, 200]
      n_coincidental_episodes: [300, 500]
      n_coordinated_episodes: [150, 250]

variants:
  # Proposed model.
  gated: {}
  # Fusion and stream ablation.
  concat:
    model: {fusion: concat}
  temporal_only:
    model: {use_spatial: false}
  spatial_only:
    model: {use_temporal: false}
  # Base paper design on the same data: GAT on each snapshot, then a GRU.
  continuum_style:
    model: {architecture: chained}

# Non-graph baselines.
baselines: [rule_based, logistic_regression, random_forest]
